syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.payment.v1";
option java_outer_classname = "PaymentProto";

import "google/protobuf/timestamp.proto";


service PaymentService {
  rpc CreatePayment(CreatePaymentRequest)
      returns (CreatePaymentResponse);

  rpc GetPayment(GetPaymentRequest)
      returns (GetPaymentResponse);
}


message CreatePaymentRequest {
  string subscription_id = 1;
  int64 user_id = 2;
  int64 amount = 3;
  string currency = 4;
  string payment_method_id = 5;
  string idempotency_key = 6;
}


message CreatePaymentResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message Payment {
  string id = 1;
  string subscription_id = 2;
  int64 user_id = 3;
  int64 amount = 4;
  string currency = 5;
  PaymentStatus status = 6;
  string failure_code = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}


enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_SUCCEEDED = 2;
  PAYMENT_STATUS_FAILED = 3;
}